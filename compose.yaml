name: projekt-ceny-mieszkan

services:
  api:
    build: .
    image: projekt-ceny-mieszkan:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
